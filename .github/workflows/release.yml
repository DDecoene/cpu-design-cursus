name: Tests en release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installeer Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Draai alle labtests
        run: python3 test_labs.py

  boek:
    # Bouwt het boek bij elke push (te downloaden als artefact).
    # Bij een tag zoals v1.0.0 komen de PDF's ook bij een release.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe heeft de tags nodig voor het versienummer
      - name: Installeer pandoc en Typst
        # vaste versies, zodat het boek er bij elke release hetzelfde uitziet
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.1.11.1/pandoc-3.1.11.1-1-amd64.deb
          sudo apt-get install -y ./pandoc-3.1.11.1-1-amd64.deb
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz \
            | sudo tar -xJ -C /usr/local/bin --strip-components=1 typst-x86_64-unknown-linux-musl/typst
      - name: Bouw het boek
        run: ./build.py
      - name: Controleer dat alle PDF's er zijn
        run: test "$(ls pdf/*.pdf | wc -l)" -eq 3
      - uses: actions/upload-artifact@v4
        with:
          name: boek
          path: pdf/*.pdf
      - name: Maak de release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" pdf/*.pdf \
            --title "${{ github.ref_name }}" \
            --notes "Het boek, gebouwd uit de bronbestanden in deze tag. cpu-design-cursus.pdf is voor het scherm (alles in één bestand, klikbaar). Om af te drukken: cpu-design-cursus-print.pdf (recto-verso, met rugmarge) en cpu-design-cursus-codeboek-print.pdf (de lange listings, als tweede map)."

  site:
    # Bouwt de webcursus en test de site; de bouw faalt bij een kapotte interne link.
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installeer pandoc
        # dezelfde vaste versie als bij het boek
        run: |
          wget -q https://github.com/jgm/pandoc/releases/download/3.1.11.1/pandoc-3.1.11.1-1-amd64.deb
          sudo apt-get install -y ./pandoc-3.1.11.1-1-amd64.deb
      - name: Test de site (Python en JavaScript)
        run: |
          python3 test_site.py
          node --test web/test/*.test.js
      - name: Bouw de site
        run: ./build.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  publiceer:
    # Alleen een push naar main publiceert; pull requests bouwen alleen.
    needs: site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
